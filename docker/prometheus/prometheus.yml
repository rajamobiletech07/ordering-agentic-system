global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: ordering-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - agent-service:8010
          - llm-gateway:8020
          - mcp-recommendation:9001
          - mcp-ordering:9002
          - mcp-payment:9003
          - mcp-notification:9004
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
