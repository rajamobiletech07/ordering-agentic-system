# Central (gateway) collector: receives from sidecars and directly from low-volume services.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter: {check_interval: 2s, limit_mib: 256}
  batch: {}
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
  debug: {verbosity: basic}
service:
  telemetry: {logs: {level: warn}}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [otlp/jaeger]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
