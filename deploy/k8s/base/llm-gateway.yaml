# Single entry point for model access. The only workload allowed to reach the internet (Claude,
# OpenAI and Gemini APIs via Cloud NAT) and the only one holding provider keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels: {app: llm-gateway, app.kubernetes.io/name: llm-gateway, app.kubernetes.io/component: llm-gateway}
spec:
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}}
  selector: {matchLabels: {app: llm-gateway}}
  template:
    metadata:
      labels: {app: llm-gateway, app.kubernetes.io/name: llm-gateway, app.kubernetes.io/part-of: ordering, ordering.io/metrics: "true"}
    spec:
      serviceAccountName: llm-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 100    # route deadline is 90s
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: llm-gateway}}}
      containers:
        - name: llm-gateway
          image: "${IMAGE}"
          command: ["uvicorn", "ordering.llm_gateway.main:app", "--host", "0.0.0.0", "--port", "8020",
                    "--timeout-graceful-shutdown", "90"]
          ports: [{containerPort: 8020, name: http}]
          envFrom: [{configMapRef: {name: ordering-config}}]
          env:
            - {name: SERVICE_NAME, value: llm-gateway}
            - {name: DATABASE_URL_FILE, value: /run/secrets/ordering/database_url}
            - {name: REDIS_URL_FILE, value: /run/secrets/ordering/redis_url}
            - {name: SERVICE_JWT_SECRET_FILE, value: /run/secrets/ordering/service_jwt_secret}
            - {name: ANTHROPIC_API_KEY_FILE, value: /run/secrets/ordering/anthropic_api_key}
            - {name: OPENAI_API_KEY_FILE, value: /run/secrets/ordering/openai_api_key}
            - {name: GOOGLE_API_KEY_FILE, value: /run/secrets/ordering/google_api_key}
            - {name: LITELLM_API_KEY_FILE, value: /run/secrets/ordering/litellm_api_key}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 3}
          lifecycle:
            preStop: {exec: {command: ["sleep", "10"]}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/ordering, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          csi: {driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: llm-gateway-secrets}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: llm-gateway, labels: {app: llm-gateway}}
spec:
  type: ClusterIP
  selector: {app: llm-gateway}
  ports: [{name: http, port: 8020, targetPort: http}]
