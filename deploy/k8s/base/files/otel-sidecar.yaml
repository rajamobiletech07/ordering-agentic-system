# Telemetry SIDECAR (api-gateway, agent-service): the app exports OTLP to localhost:4317, never
# blocks on the backend, and sensitive attributes are dropped before data leaves the pod.
# Same design as docker/otel/sidecar.yaml; forwards to the in-cluster gateway collector.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "localhost:4317"}
      http: {endpoint: "localhost:4318"}
processors:
  memory_limiter: {check_interval: 2s, limit_mib: 100}
  batch: {timeout: 2s, send_batch_size: 200, send_batch_max_size: 200}
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: enduser.id, action: hash}
  resource:
    attributes:
      - {key: telemetry.collector, value: sidecar, action: upsert}
exporters:
  otlp:
    endpoint: otel-collector:4317
    tls: {insecure: true}   # in-cluster hop; NetworkPolicy restricts who can reach the collector
    sending_queue: {enabled: true, queue_size: 5000}
    retry_on_failure: {enabled: true, max_elapsed_time: 120s}
service:
  telemetry: {logs: {level: warn}}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, resource, batch], exporters: [otlp]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp]}
