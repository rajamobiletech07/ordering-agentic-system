# One Kubernetes ServiceAccount per workload. GKE Workload Identity maps each one to IAM
# directly (principal://.../subject/ns/ordering/sa/<name>), with no Google service account keys.
# Terraform (deploy/gcp/terraform/iam.tf) grants each KSA only the Secret Manager secrets it
# mounts, and grants the collector its Cloud Trace / Monitoring writer roles.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-gateway, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-service, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: llm-gateway, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mcp-server, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: notification-worker, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
# migrations, RAG ingestion, seeding (staging), smoke tests and ops one-offs
apiVersion: v1
kind: ServiceAccount
metadata: {name: ordering-jobs, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-collector, labels: {ordering.io/phase: pre}}
automountServiceAccountToken: false
