# Secret Manager -> pod files via the GKE Secret Manager add-on (CSI driver secrets-store-gke.csi.k8s.io).
# Files land in /run/secrets/ordering/<path>, and the app reads them through <NAME>_FILE (see
# src/ordering/common/config.py). No Kubernetes Secret objects are created, so secret values
# never sit in etcd. Each workload gets only what it uses; Terraform grants its KSA
# secretAccessor on exactly these secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: api-gateway-secrets, labels: {ordering.io/phase: pre}}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_ID}/secrets/ordering-redis-url/versions/latest"
        path: "redis_url"
      - resourceName: "projects/${PROJECT_ID}/secrets/ordering-redis-ca/versions/latest"
        path: "redis_ca.pem"
      - resourceName: "projects/${PROJECT_ID}/secrets/ordering-jwt-secret/versions/latest"
        path: "jwt_secret"
---
