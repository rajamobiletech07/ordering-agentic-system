[project]
name = "ordering-agentic-system"
version = "1.0.0"
description = "Agentic ordering chatbot: API gateway, LLM gateway, LangGraph supervisor, MCP servers, RAG."
requires-python = ">=3.12,<3.14"
readme = "README.md"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ordering" = ["**/*.yaml", "**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: needs PostgreSQL + Redis (docker compose up postgres redis)",
  "e2e: needs the full docker compose stack running",
  "live_llm: calls real LLM providers (needs API keys)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/ordering"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "B008", "RUF012", "S608", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
plugins = ["pydantic.mypy"]
files = ["src/ordering/common", "src/ordering/security", "src/ordering/decorators", "src/ordering/llm_gateway"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B608: every f-string SQL interpolates only module constants (column lists) or a whitelisted
# embedding-profile table suffix (validated against PROFILE_DIMS); all values are bound parameters.
skips = ["B101", "B311", "B608"]
