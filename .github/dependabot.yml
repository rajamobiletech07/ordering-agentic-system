version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    groups:
      llm-sdks: {patterns: ["anthropic", "openai", "google-genai", "fastembed"]}
      otel: {patterns: ["opentelemetry-*"]}
  - package-ecosystem: docker
    directory: "/docker"
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
